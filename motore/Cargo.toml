[package]
name = "avventura"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = "3.5.2"
llama-cpp-2 = { version = "0.1.161", optional = true }
owo-colors = "4.4.0"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
rustyline = "19.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sys-locale = "0.3.2"
textwrap = { version = "0.16.4", features = ["terminal_size"] }
thiserror = "2.0.21"
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
tempfile = "3.27.0"
tiny_http = "0.12.0"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Console", "Win32_Foundation"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Feature opzionali (§5.5). La build predefinita non le include: chi non usa il
# fornitore "locale" non ha bisogno di CMake, Clang/LLVM né CUDA.
# - locale: llama.cpp integrato (crate `llama-cpp-2`), solo CPU;
# - cuda:   come locale, con accelerazione GPU NVIDIA (serve il CUDA Toolkit);
# - vulkan: come locale, con accelerazione Vulkan (serve il Vulkan SDK).
[features]
default = []
locale = ["dep:llama-cpp-2"]
cuda = ["locale", "llama-cpp-2/cuda"]
vulkan = ["locale", "llama-cpp-2/vulkan"]
